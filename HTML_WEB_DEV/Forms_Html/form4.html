<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Employee Details Form</h1>
    <form action="">
      <label for="name">Full Name : </label>
      <input
        type="text"
        id="name"
        name="username"
        placeholder="Enter your full name"
      />
      <br /><br />

      <label for="email">Email : </label>
      <input
        type="email"
        id="email"
        name="useremail"
        placeholder="Enter you email address"
      />
      <br /><br />

      <label for="phone">Phone Number : </label>
      <input
        type="tel"
        id="phone"
        name="userphone"
        placeholder="Enter your phone number"
      />
      <br /><br />

      <label>Gender : </label>
      <input type="radio" id="male" name="usergender" value="Male" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="usergender" value="Female" />
      <label for="female">Female</label>
      <input type="radio" id="other" name="usergender" value="Other" />
      <label for="other">Other</label>
      <br /><br />

      <label for="title">Job Title : </label>
      <input
        type="text"
        id="title"
        name="jobtitle"
        placeholder="Enter your job title"
      />
      <br /><br />

      <label for="department">Department : </label>
      <select name="userdepartment" id="department" required>
        Select your department
        <option value="" disabled selected>Select your department</option>
        <!-- with disabled selected now user can not select this option-->
        <option value="">Engineering</option>
        <!-- we have to mention value with the option to send that in the backend-->
        <option value="Medical">Medical</option>
        <option value="Humanities">Humanities</option>
      </select>
      <br /><br />

      <button>Submit</button>
    </form>
  </body>
</html>
