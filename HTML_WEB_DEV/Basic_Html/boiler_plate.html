<!DOCTYPE html>
<!-- This tells the browser that we are using HTML5. -->

<html lang="en">
<!-- The HTML document starts here.
     lang="en" specifies that the primary language of the page is English.
     This helps search engines and accessibility tools understand the language. -->

<head>
    <!-- The head contains metadata and other information about the webpage.
         Metadata means data about the webpage/document. -->

    <meta charset="UTF-8">
    <!-- Specifies the character encoding used by the webpage.
         UTF-8 supports a very large range of characters and symbols. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Controls how the webpage is displayed on different devices.
         width=device-width makes the page width match the device's screen width.
         initial-scale=1.0 sets the initial zoom level. -->

    <title>Boiler-Plate</title>
    <!-- Sets the title of the webpage, usually displayed in the browser tab. -->

</head>

<body>
    <!-- The body contains the content that is displayed on the webpage. -->
</body>

</html>
